<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel Engineering Analysis</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.0/dist/Recharts.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #1a1a1a; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }
    #root { width: 100%; min-height: 100vh; }
    button {
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ── WHEEL SIZES ───────────────────────────────────────────────────────────────
    const WHEEL_SIZES = {
      '26"':   { erd: 534, label: '26"' },
      '27.5"': { erd: 559, label: '27.5"' },
      '29"':   { erd: 600, label: '29"' },
    };

    // ── PHYSICS ENGINE ────────────────────────────────────────────────────────────
    function calcWheel({ d_ds, d_nds, pcd_ds, pcd_nds, erd_mm, t_ds, n_spokes }) {
      const EA   = 210e9 * Math.PI * 1e-6;
      const Ns   = Math.floor(n_spokes / 2);
      const R_E  = erd_mm / 2 / 1000;
      const R    = 0.311;
      const EIL  = 50, EIR = 150, GJ = 40;
      const coeff = Math.PI / Math.pow(R, 3);
      const cos_x = Math.cos(4 * Math.PI * 3 / Ns);

      const T    = t_ds * 9.81;
      const Rfa  = pcd_ds  / 2 / 1000;
      const Rfb  = pcd_nds / 2 / 1000;
      const da   = d_ds  / 1000;
      const db   = d_nds / 1000;

      const r2a  = R_E**2 + Rfa**2 - 2*R_E*Rfa*cos_x;
      const r2b  = R_E**2 + Rfb**2 - 2*R_E*Rfb*cos_x;
      const La   = Math.sqrt(da**2 + r2a);
      const Lb   = Math.sqrt(db**2 + r2b);
      const sa   = da / La,  sb = db / Lb;

      const ratio = sa / sb;
      const Tnds  = T * ratio;

      const Ka   = EA / La,  Kb = EA / Lb;
      const kla  = T    / La + Ka * sa**2;
      const klb  = Tnds / Lb + Kb * sb**2;
      const kra  = T    / La + Ka * (r2a / (da**2 + r2a));
      const krb  = Tnds / Lb + Kb * (r2b / (db**2 + r2b));

      const Ksl  = (Ns / 2) * (kla + klb);
      const Ksr  = (Ns / 2) * (kra + krb);
      let   Cl   = 1 / (2 * Ksl),  Cr = 1 / (2 * Ksr);

      for (let m = 1; m <= Ns; m++) {
        const q = m * m;
        Cl += 1 / (Ksl + coeff * (EIL * (q-1)**2 + GJ * (q-1)));
        Cr += 1 / (Ksr + coeff * EIR * (q-1)**2);
      }
      const Kl = 1 / Cl / 1000;
      const Kr = 1 / Cr / 1000;

      const Flat = Tnds * Kl * 1e3 / (EA * sb / Lb);
      const Frad = Tnds * Kr * 1e3 / (EA / Lb);

      return {
        ratio_pct : +(ratio * 100).toFixed(1),
        t_nds     : +(Tnds / 9.81).toFixed(1),
        beta_ds   : +(Math.asin(Math.min(sa,0.9999)) * 180 / Math.PI).toFixed(2),
        beta_nds  : +(Math.asin(Math.min(sb,0.9999)) * 180 / Math.PI).toFixed(2),
        K_lat     : +Kl.toFixed(1),
        K_rad     : +Kr.toFixed(0),
        F_lat_kgf : +(Flat / 9.81).toFixed(1),
        F_rad_kgf : +(Frad / 9.81).toFixed(1),
        L_ds_mm   : +(La * 1000).toFixed(1),
        L_nds_mm  : +(Lb * 1000).toFixed(1),
        ftf       : +(d_ds + d_nds).toFixed(1),
      };
    }

    // ── CHRIS KING PRESETS ────────────────────────────────────────────────────────
    const PRESETS = [
      { id:'r142', short:'ISO 135/142', name:'ISO 135/142',      OLD:142, type:'rear',  d_ds:20.1, d_nds:33.9, pcd_ds:57.4, pcd_nds:57.4 },
      { id:'r148', short:'Boost 148×12', name:'Boost 148×12',     OLD:148, type:'rear',  d_ds:24.0, d_nds:36.3, pcd_ds:57.4, pcd_nds:57.4 },
      { id:'r157', short:'Superboost 157', name:'Superboost 157',OLD:157, type:'rear',  d_ds:28.8, d_nds:40.3, pcd_ds:57.4, pcd_nds:57.4 },
      { id:'r157b',short:'DH G2157',name:'DH G2157',    OLD:157, type:'rear',  d_ds:29.5, d_nds:39.5, pcd_ds:58.0, pcd_nds:58.0 },
      { id:'f100', short:'R45D 100 front',   name:'R45D 100 front',  OLD:100, type:'front', d_ds:30.6, d_nds:22.3, pcd_ds:57.4, pcd_nds:57.4 },
      { id:'f110a',short:'Boost 6B 110 front',name:'Boost 6B 110 front',OLD:110,type:'front',d_ds:36.3,d_nds:27.3,pcd_ds:57.4,pcd_nds:57.4 },
      { id:'f110b',short:'Boost CL 110 front',name:'Boost CL 110 front', OLD:110, type:'front', d_ds:35.5, d_nds:27.5, pcd_ds:57.4, pcd_nds:57.4 },
    ];

    // ── COLOUR FUNCTIONS ──────────────────────────────────────────────────────────
    const rCol = (r, type) => {
      if (type === 'front') {
        if (r <= 112) return '#4fc3f7';
        if (r <= 128) return '#81c784';
        return '#ffb74d';
      }
      if (r >= 90) return '#4fc3f7';
      if (r >= 80) return '#81c784';
      if (r >= 70) return '#ffb74d';
      if (r >= 60) return '#ff7043';
      return '#e74c3c';
    };

    // ── MAIN COMPONENT ────────────────────────────────────────────────────────────
    function HubAnalysis() {
      const [tab,       setTab      ] = useState('tension');
      const [wheelKey,  setWheelKey ] = useState('29"');
      const [presetId,  setPresetId ] = useState('r148');
      const [custom,    setCustom   ] = useState(false);
      const [dDS,       setDDS      ] = useState(24.0);
      const [dNDS,      setDNDS     ] = useState(36.3);
      const [pcdDS,     setPcdDS    ] = useState(57.4);
      const [pcdNDS,    setPcdNDS   ] = useState(57.4);
      const [tDS,       setTDS      ] = useState(100);
      const [nSpokes,   setNSpokes  ] = useState(32);
      const [wheelType, setWheelType] = useState('rear');

      const erd = WHEEL_SIZES[wheelKey].erd;

      const filteredPresets = PRESETS.filter(p => p.type === wheelType);

      const hubParams = custom
        ? { d_ds: dDS, d_nds: dNDS, pcd_ds: pcdDS, pcd_nds: pcdNDS, OLD: null, type: wheelType, name: 'Custom' }
        : { ...filteredPresets.find(p => p.id === presetId) };

      if (!hubParams || !hubParams.d_ds) {
        return <div style={{padding: 40, color: '#999'}}>Loading...</div>;
      }

      const m = useMemo(() => calcWheel({
        d_ds:  hubParams.d_ds,  d_nds: hubParams.d_nds,
        pcd_ds:hubParams.pcd_ds,pcd_nds:hubParams.pcd_nds,
        erd_mm:erd, t_ds:tDS, n_spokes:nSpokes
      }), [hubParams.d_ds,hubParams.d_nds,hubParams.pcd_ds,hubParams.pcd_nds,erd,tDS,nSpokes]);

      const allM = filteredPresets.map(p => ({
        ...p,
        ...calcWheel({ d_ds:p.d_ds,d_nds:p.d_nds,pcd_ds:p.pcd_ds,pcd_nds:p.pcd_nds,
                       erd_mm:erd,t_ds:tDS,n_spokes:nSpokes }),
        isActive: !custom && p.id === presetId,
      }));
      
      const customRow = custom ? [{
        id:'custom',short:'Custom',name:'Custom',type:wheelType,OLD:null,
        d_ds:dDS,d_nds:dNDS,pcd_ds:pcdDS,pcd_nds:pcdNDS,isActive:true,...m
      }] : [];
      
      const chartData = [...allM, ...customRow];

      return (
        <div style={{background:'#1a1a1a',minHeight:'100vh',fontFamily:'inherit',color:'#e0e0e0'}}>

          {/* HEADER */}
          <div style={{background:'#242424',padding:'24px',borderBottom:'1px solid #333'}}>
            <h1 style={{margin:'0 0 8px',fontSize:24,fontWeight:600,color:'#fff'}}>
              Wheel Engineering Analysis
            </h1>
            <p style={{margin:0,color:'#aaa',fontSize:13}}>
              Chris King MTB Hubs · Mode Matrix Model
            </p>
          </div>

          {/* CONTROLS */}
          <div style={{background:'#242424',padding:'24px',borderBottom:'1px solid #333'}}>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:13,fontWeight:500,marginBottom:8,color:'#aaa',textTransform:'uppercase',letterSpacing:0.5}}>Wheel type</div>
              <div style={{display:'flex',gap:8}}>
                {['rear','front'].map(type => (
                  <button key={type} onClick={()=>{setWheelType(type);setPresetId(PRESETS.find(p=>p.type===type).id);setCustom(false);}}
                    style={{
                      padding:'8px 16px',
                      border:'1px solid #444',
                      background: wheelType===type ? '#2196F3' : '#333',
                      color: wheelType===type ? '#fff' : '#aaa',
                      cursor:'pointer',
                      borderRadius:6,
                      fontSize:13,
                      fontWeight:500,
                      transition:'all 0.2s'
                    }}>
                    {type.charAt(0).toUpperCase() + type.slice(1)} wheel
                  </button>
                ))}
              </div>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1.5fr',gap:24,alignItems:'start'}}>
              
              <div>
                <div style={{fontSize:13,fontWeight:500,marginBottom:8,color:'#aaa',textTransform:'uppercase',letterSpacing:0.5}}>Wheel size</div>
                <div style={{display:'flex',gap:8}}>
                  {Object.keys(WHEEL_SIZES).map(k => (
                    <button key={k} onClick={()=>setWheelKey(k)}
                      style={{
                        padding:'8px 14px',
                        border:'1px solid #444',
                        background: wheelKey===k ? '#2196F3' : '#333',
                        color: wheelKey===k ? '#fff' : '#aaa',
                        cursor:'pointer',
                        borderRadius:6,
                        fontSize:13,
                        fontWeight:500,
                        transition:'all 0.2s'
                      }}>{k}</button>
                  ))}
                </div>
              </div>

              <div>
                <div style={{fontSize:13,fontWeight:500,marginBottom:8,color:'#aaa',textTransform:'uppercase',letterSpacing:0.5}}>Spokes</div>
                <div style={{display:'flex',gap:8}}>
                  {[28,32,36].map(n => (
                    <button key={n} onClick={()=>setNSpokes(n)}
                      style={{
                        padding:'8px 14px',
                        border:'1px solid #444',
                        background: nSpokes===n ? '#2196F3' : '#333',
                        color: nSpokes===n ? '#fff' : '#aaa',
                        cursor:'pointer',
                        borderRadius:6,
                        fontSize:13,
                        fontWeight:500,
                        transition:'all 0.2s'
                      }}>{n}H</button>
                  ))}
                </div>
              </div>

              <div>
                <div style={{fontSize:13,fontWeight:500,marginBottom:8,color:'#aaa',textTransform:'uppercase',letterSpacing:0.5}}>DS ref. tension</div>
                <div style={{display:'flex',alignItems:'center',gap:12}}>
                  <input type="range" min={60} max={130} step={1} value={tDS}
                    onChange={e => setTDS(+e.target.value)}
                    style={{flex:1,cursor:'pointer',height:4,accentColor:'#2196F3'}}/>
                  <span style={{fontSize:16,fontWeight:600,minWidth:60}}>{tDS} kgf</span>
                </div>
              </div>
            </div>

            <div style={{marginTop:20}}>
              <div style={{fontSize:13,fontWeight:500,marginBottom:12,color:'#aaa',textTransform:'uppercase',letterSpacing:0.5}}>
                Hub preset — all Chris King MTB (PCD 57.4 mm, source: chrisking.com)
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {filteredPresets.map(p => (
                  <button key={p.id} onClick={()=>{setPresetId(p.id);setCustom(false);}}
                    style={{
                      padding:'8px 16px',
                      border:'1px solid #444',
                      background: presetId===p.id&&!custom ? '#2196F3' : '#333',
                      color: presetId===p.id&&!custom ? '#fff' : '#aaa',
                      cursor:'pointer',
                      borderRadius:6,
                      fontSize:13,
                      fontWeight:500,
                      transition:'all 0.2s'
                    }}>{p.short}</button>
                ))}
                <button onClick={()=>setCustom(!custom)}
                  style={{
                    padding:'8px 16px',
                    border:'1px solid #444',
                    background: custom ? '#2196F3' : '#333',
                    color: custom ? '#fff' : '#aaa',
                    cursor:'pointer',
                    borderRadius:6,
                    fontSize:13,
                    fontWeight:500,
                    transition:'all 0.2s'
                  }}>Custom ✎</button>
              </div>
            </div>
          </div>

          {/* TABS */}
          <div style={{display:'flex',gap:0,borderBottom:'1px solid #333',background:'#1a1a1a',padding:'0 24px'}}>
            {[['tension','Tension balance'],['geo','Geometry'],['strength','Strength'],['table','Data']].map(([id,label])=>(
              <button key={id} onClick={()=>setTab(id)}
                style={{
                  flex:'0 0 auto',
                  padding:'16px 20px',
                  border:'none',
                  background:'none',
                  color: tab===id ? '#2196F3' : '#666',
                  borderBottom: tab===id ? '2px solid #2196F3' : 'none',
                  cursor:'pointer',
                  fontSize:14,
                  fontWeight:500,
                  transition:'all 0.2s'
                }}>{label}</button>
            ))}
          </div>

          <div style={{padding:'24px',maxWidth:1400,margin:'0 auto'}}>

            {/* TENSION TAB */}
            {tab==='tension' && (
              <div>
                <p style={{color:'#999',marginBottom:24,fontSize:14}}>
                  NDS/DS tension ratio across all presets — active hub highlighted. Target ≥ 80% for rear hubs.
                </p>
                
                <div style={{background:'#242424',padding:20,borderRadius:8,border:'1px solid #333'}}>
                  {chartData.map(h => {
                    const rc = rCol(h.ratio_pct,h.type);
                    const isAct = h.isActive;
                    const barWidth = Math.min(h.ratio_pct, 100);
                    return (
                      <div key={h.id} style={{marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
                        <div style={{minWidth:120,fontSize:14,fontWeight:500,color:isAct?'#fff':'#aaa'}}>{h.short}</div>
                        <div style={{flex:1}}>
                          <div style={{position:'relative',height:32,background:'#333',borderRadius:4,overflow:'hidden'}}>
                            <div style={{
                              position:'absolute',
                              left:0,
                              top:0,
                              bottom:0,
                              width:`${barWidth}%`,
                              background:rc,
                              opacity:isAct?1:0.7,
                              transition:'width 0.2s'
                            }}/>
                            <div style={{position:'absolute',left:'80%',top:0,bottom:0,width:2,background:'rgba(255,255,255,0.2)'}}/>
                          </div>
                        </div>
                        <div style={{minWidth:50,textAlign:'right',fontSize:14,fontWeight:600,color:rc}}>{h.ratio_pct}%</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* STRENGTH TAB */}
            {tab==='strength' && (
              <div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:24,marginBottom:24}}>
                  <div style={{background:'#242424',padding:16,borderRadius:8,border:'1px solid #333'}}>
                    <div style={{fontSize:12,color:'#999',marginBottom:8,textTransform:'uppercase',letterSpacing:0.5}}>F_rad — radial strength (kgf) · Ford primary metric</div>
                    <div style={{fontSize:28,fontWeight:600,color:'#9c27b0'}}>{m.F_rad_kgf}</div>
                  </div>
                  <div style={{background:'#242424',padding:16,borderRadius:8,border:'1px solid #333'}}>
                    <div style={{fontSize:12,color:'#999',marginBottom:8,textTransform:'uppercase',letterSpacing:0.5}}>F_lat — lateral strength (kgf)</div>
                    <div style={{fontSize:28,fontWeight:600,color:'#ff9800'}}>{m.F_lat_kgf}</div>
                  </div>
                  <div style={{background:'#242424',padding:16,borderRadius:8,border:'1px solid #333'}}>
                    <div style={{fontSize:12,color:'#999',marginBottom:8,textTransform:'uppercase',letterSpacing:0.5}}>K_lat — lateral stiffness (N/mm)</div>
                    <div style={{fontSize:28,fontWeight:600,color:'#4caf50'}}>{m.K_lat}</div>
                  </div>
                </div>

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
                  <div style={{background:'#242424',padding:20,borderRadius:8,border:'1px solid #333'}}>
                    <div style={{fontSize:13,color:'#999',marginBottom:16,fontWeight:500}}>F_rad — radial strength (kgf) · Ford primary metric</div>
                    <ResponsiveContainer width="100%" height={250}>
                      <BarChart data={chartData} margin={{top:10,right:10,bottom:40,left:0}}>
                        <CartesianGrid strokeDasharray="3,3" stroke="#333"/>
                        <XAxis dataKey="short" tick={{fill:'#999',fontSize:11}} angle={-45} textAnchor="end" height={80}/>
                        <YAxis tick={{fill:'#999',fontSize:11}} domain={[0,300]}/>
                        <Tooltip content={({active,payload})=>active&&payload?<div style={{background:'#333',padding:8,border:'1px solid #555',borderRadius:4}}><p style={{margin:0,color:'#fff',fontSize:12}}>{payload[0].value} kgf</p></div>:null}/>
                        <Bar dataKey="F_rad_kgf" name="F_rad" radius={[6,6,0,0]}>
                          {chartData.map((d,i)=><Cell key={i} fill={d.isActive?'#9c27b0':'#673ab7'} opacity={d.isActive?1:0.6}/>)}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>

                  <div style={{background:'#242424',padding:20,borderRadius:8,border:'1px solid #333'}}>
                    <div style={{fontSize:13,color:'#999',marginBottom:16,fontWeight:500}}>F_lat — lateral strength (kgf)</div>
                    <ResponsiveContainer width="100%" height={250}>
                      <BarChart data={chartData} margin={{top:10,right:10,bottom:40,left:0}}>
                        <CartesianGrid strokeDasharray="3,3" stroke="#333"/>
                        <XAxis dataKey="short" tick={{fill:'#999',fontSize:11}} angle={-45} textAnchor="end" height={80}/>
                        <YAxis tick={{fill:'#999',fontSize:11}} domain={[0,90]}/>
                        <Tooltip content={({active,payload})=>active&&payload?<div style={{background:'#333',padding:8,border:'1px solid #555',borderRadius:4}}><p style={{margin:0,color:'#fff',fontSize:12}}>{payload[0].value} kgf</p></div>:null}/>
                        <Bar dataKey="F_lat_kgf" name="F_lat" radius={[6,6,0,0]}>
                          {chartData.map((d,i)=><Cell key={i} fill={d.isActive?'#ff9800':'#ffb74d'} opacity={d.isActive?1:0.6}/>)}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div style={{marginTop:24,background:'#242424',padding:20,borderRadius:8,border:'1px solid #333'}}>
                  <div style={{fontSize:13,color:'#999',marginBottom:16,fontWeight:500}}>K_lat — lateral stiffness (N/mm)</div>
                  <ResponsiveContainer width="100%" height={200}>
                    <BarChart data={chartData} margin={{top:10,right:10,bottom:40,left:0}}>
                      <CartesianGrid strokeDasharray="3,3" stroke="#333"/>
                      <XAxis dataKey="short" tick={{fill:'#999',fontSize:11}} angle={-45} textAnchor="end" height={80}/>
                      <YAxis tick={{fill:'#999',fontSize:11}} domain={[0,150]}/>
                      <Tooltip content={({active,payload})=>active&&payload?<div style={{background:'#333',padding:8,border:'1px solid #555',borderRadius:4}}><p style={{margin:0,color:'#fff',fontSize:12}}>{payload[0].value} N/mm</p></div>:null}/>
                      <Bar dataKey="K_lat" name="K_lat" radius={[6,6,0,0]}>
                        {chartData.map((d,i)=><Cell key={i} fill={d.isActive?'#4caf50':'#81c784'} opacity={d.isActive?1:0.6}/>)}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                </div>

                <div style={{marginTop:24,fontSize:12,color:'#999'}}>
                  Dashed line = ~38 kgf static load estimate for a 75 kg rider on the rear wheel. All values computed via Mode Matrix (bike-wheel-calc, Ford 2018). 
                  F_rad = T_NDS because K_rad × L / EA = 1 for typical spokes. Hubs use DS/right spoke as critical spoke (lower tension side).
                </div>
              </div>
            )}

            {/* GEOMETRY TAB */}
            {tab==='geo' && (
              <div style={{color:'#999'}}>
                <p>Geometry view under development. Use Tension balance and Strength tabs above.</p>
              </div>
            )}

            {/* DATA TABLE */}
            {tab==='table' && (
              <div style={{overflowX:'auto'}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                  <thead>
                    <tr style={{borderBottom:'1px solid #333'}}>
                      {['Hub','Type','d_DS','d_NDS','Ratio %','F_lat','F_rad','K_lat','K_rad'].map(h=>(
                        <th key={h} style={{padding:'12px',textAlign:'left',color:'#aaa',fontWeight:500,borderBottom:'1px solid #333'}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {chartData.map((h,i)=>{
                      const rc = rCol(h.ratio_pct,h.type);
                      return(
                        <tr key={h.id} style={{borderBottom:'1px solid #333',background:h.isActive?'#2a2a2a':'transparent'}}>
                          <td style={{padding:'12px',color:h.isActive?'#fff':'#999',fontWeight:h.isActive?500:400}}>{h.short}</td>
                          <td style={{padding:'12px',color:'#aaa',fontSize:11,textTransform:'uppercase'}}>{h.type}</td>
                          <td style={{padding:'12px',color:'#aaa'}}>{h.d_ds}</td>
                          <td style={{padding:'12px',color:'#aaa'}}>{h.d_nds}</td>
                          <td style={{padding:'12px',color:rc,fontWeight:600}}>{h.ratio_pct}%</td>
                          <td style={{padding:'12px',color:'#ff9800'}}>{h.F_lat_kgf}</td>
                          <td style={{padding:'12px',color:'#9c27b0'}}>{h.F_rad_kgf}</td>
                          <td style={{padding:'12px',color:'#4caf50'}}>{h.K_lat}</td>
                          <td style={{padding:'12px',color:'#aaa'}}>{h.K_rad}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HubAnalysis />);
  </script>
</body>
</html>
